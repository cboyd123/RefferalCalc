<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtor Referral Earnings Calculator</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #f5c518;
            --accent-hover: #d4a90e;
            --success: #16a34a;
            --warning: #dc2626;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #555555;
            --border: #e0e0e0;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Progress bar */
        .progress-bar {
            height: 4px;
            background: var(--border);
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.4s ease;
            border-radius: 0 2px 2px 0;
        }

        .step-content {
            padding: 40px 36px 36px;
        }

        .step-counter {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .step-question {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .step-context {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .step-context a {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Form inputs */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg);
            color: var(--text);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: #999;
        }

        .input-prefix {
            position: relative;
        }
        .input-prefix span {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .input-prefix input {
            padding-left: 30px;
        }

        .input-suffix {
            position: relative;
        }
        .input-suffix span {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .input-suffix input {
            padding-right: 30px;
        }

        /* Option cards for yes/no */
        .option-cards {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-card {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text);
        }
        .option-card:hover {
            border-color: var(--accent);
            background: #fef9e7;
        }
        .option-card.selected {
            border-color: var(--accent);
            background: #fef3cd;
            color: #1a1a1a;
        }

        /* Stacked option cards (for 3-4 choices) */
        .option-cards-stacked {
            flex-direction: column;
        }
        .option-cards-stacked .option-card {
            flex: none;
            text-align: left;
            padding: 14px 18px;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1a1a;
            flex: 1;
            font-weight: 700;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled {
            background: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        .btn-back {
            background: #fff;
            color: var(--text-muted);
            border: 2px solid var(--border);
        }
        .btn-back:hover { background: #f0f0f0; }

        /* Results page */
        .results-section { display: none; }

        .results-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .results-header h2 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .results-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .result-card {
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .result-card.current {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }
        .result-card.potential {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }
        .result-card.gap {
            background: #fef9e7;
            border: 1px solid #f5c518;
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .result-card.current .result-label { color: #991b1b; }
        .result-card.potential .result-label { color: #166534; }
        .result-card.gap .result-label { color: #92400e; }

        .result-value {
            font-size: 32px;
            font-weight: 800;
        }
        .result-card.current .result-value { color: var(--warning); }
        .result-card.potential .result-value { color: var(--success); }
        .result-card.gap .result-value { color: #b45309; }

        .result-detail {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Breakdown table */
        .breakdown {
            margin: 24px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .breakdown-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            padding: 14px 20px 10px;
            background: var(--bg);
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
        .breakdown-row .label { color: var(--text-muted); }
        .breakdown-row .value { font-weight: 600; color: var(--text); }
        .breakdown-row.highlight {
            background: #f0fdf4;
        }
        .breakdown-row.highlight .value { color: var(--success); font-weight: 700; }

        /* Visual bar chart */
        .bar-chart {
            margin: 28px 0 8px;
            padding: 20px 24px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card-bg);
        }
        .bar-chart-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .bar-row {
            margin-bottom: 16px;
        }
        .bar-row:last-child {
            margin-bottom: 0;
        }
        .bar-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .bar-label-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .bar-label-value {
            font-size: 15px;
            font-weight: 800;
        }
        .bar-track {
            height: 32px;
            background: var(--bg);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 1s ease-out;
            min-width: 2%;
        }
        .bar-fill.current {
            background: linear-gradient(90deg, #fca5a5, #ef4444);
        }
        .bar-fill.potential {
            background: linear-gradient(90deg, #86efac, #16a34a);
        }
        .bar-fill.gap-fill {
            background: linear-gradient(90deg, #fde68a, #f59e0b);
        }
        .bar-gap-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            padding: 8px 16px;
            background: #fef9e7;
            border: 1px dashed #f5c518;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #92400e;
        }

        /* Monthly breakdown */
        .monthly-breakdown {
            display: flex;
            gap: 12px;
            margin: 20px 0 8px;
        }
        .monthly-card {
            flex: 1;
            text-align: center;
            padding: 16px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
        }
        .monthly-card .monthly-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .monthly-card .monthly-value {
            font-size: 22px;
            font-weight: 800;
            color: #b45309;
        }
        .monthly-card .monthly-context {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        /* Network Health Score */
        .health-score-card {
            text-align: center;
            padding: 28px 20px;
            margin: 20px 0 8px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card-bg);
        }
        .health-score-card .health-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .health-grade {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
        }
        .health-grade.grade-a { background: #dcfce7; color: #15803d; }
        .health-grade.grade-b { background: #fef9c3; color: #a16207; }
        .health-grade.grade-c { background: #ffedd5; color: #c2410c; }
        .health-grade.grade-d { background: #fee2e2; color: #dc2626; }
        .health-summary {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 12px;
            line-height: 1.5;
        }
        .health-factors {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .health-factor {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #f5f5f5;
            color: #555;
        }
        .health-factor .factor-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .factor-dot.good { background: #22c55e; }
        .factor-dot.ok { background: #eab308; }
        .factor-dot.poor { background: #ef4444; }

        /* Biggest opportunity callout */
        .opportunity-callout {
            margin: 20px 0 8px;
            padding: 20px 24px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1px solid #f59e0b;
            position: relative;
            overflow: hidden;
        }
        .opportunity-callout::before {
            content: '💡';
            position: absolute;
            top: -8px;
            right: 12px;
            font-size: 48px;
            opacity: 0.15;
        }
        .opportunity-callout .opp-eyebrow {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #92400e;
            margin-bottom: 6px;
        }
        .opportunity-callout .opp-headline {
            font-size: 18px;
            font-weight: 800;
            color: #78350f;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .opportunity-callout .opp-detail {
            font-size: 13px;
            color: #92400e;
            line-height: 1.5;
        }
        .opportunity-callout .opp-value {
            font-size: 24px;
            font-weight: 900;
            color: #b45309;
            margin-top: 10px;
        }

        /* Source footnote */
        .data-source {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* CTA section */
        .cta-section {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .cta-section p {
            font-size: 15px;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .cta-section .btn-cta {
            display: inline-block;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 700;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .cta-section .btn-cta:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245,197,24,0.4);
        }
        .btn-restart {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            text-decoration: underline;
        }

        /* Hidden utility */
        .hidden { display: none !important; }

        /* Animate step transitions */
        .step { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .step-content { padding: 28px 22px 26px; }
            .step-question { font-size: 19px; }
            .result-value { font-size: 26px; }
            .option-cards { flex-direction: column; }
        }

        /* ==================== HERO LANDING PAGE ==================== */
        body.hero-active {
            display: block;
            padding: 0;
            align-items: stretch;
            justify-content: flex-start;
        }
        body.hero-active .calculator {
            display: none;
        }

        .hero-landing {
            width: 100%;
        }

        /* Hero above the fold */
        .hero-section {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            background: linear-gradient(180deg, #ffffff 0%, #fffef5 100%);
        }

        .hero-headline {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--primary);
            max-width: 720px;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .highlight-word {
            position: relative;
            display: inline;
        }
        .highlight-word::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            height: 10px;
            background: rgba(245, 197, 24, 0.35);
            z-index: -1;
            border-radius: 2px;
        }

        .hero-subheadline {
            font-size: 19px;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .hero-badges {
            display: flex;
            gap: 12px;
            margin-bottom: 36px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hero-badge {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 100px;
            letter-spacing: 0.3px;
        }

        .hero-cta {
            padding: 18px 48px;
            font-size: 17px;
            font-weight: 700;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hero-cta:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245, 197, 24, 0.35);
        }

        /* Stats strip */
        .stats-strip {
            background: #fef9e7;
            padding: 48px 24px;
            display: flex;
            justify-content: center;
            gap: 64px;
            flex-wrap: wrap;
        }
        .stat-block { text-align: center; }
        .stat-number {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 220px;
            line-height: 1.4;
            margin-top: 4px;
        }

        /* What you'll discover */
        .learn-section {
            padding: 64px 24px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }
        .learn-section h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            color: var(--primary);
        }
        .learn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .learn-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 20px;
            text-align: left;
        }
        .learn-card-icon {
            width: 44px;
            height: 44px;
            background: #fef3cd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
            font-weight: 700;
            color: #b45309;
        }
        .learn-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .learn-card p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Hero form section */
        .hero-form-section {
            padding: 16px 24px 64px;
            display: flex;
            justify-content: center;
        }
        .hero-form-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .hero-form-card h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
        }
        .hero-form-card .form-subtext {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .hero-privacy {
            font-size: 12px;
            color: #999;
            margin-top: 12px;
        }

        /* Hero responsive */
        @media (max-width: 768px) {
            .hero-headline { font-size: 36px; }
            .hero-subheadline { font-size: 16px; }
            .learn-grid { grid-template-columns: 1fr; }
            .stats-strip { gap: 32px; flex-direction: column; align-items: center; }
            .stat-number { font-size: 32px; }
        }
        @media (max-width: 480px) {
            .hero-headline { font-size: 30px; }
            .hero-section { padding: 40px 18px; min-height: auto; padding-top: 80px; padding-bottom: 60px; }
            .hero-form-card { padding: 28px 22px; }
            .hero-cta { padding: 16px 36px; font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="calculator" id="calculator">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="step-content" id="stepContainer">
        <!-- Steps render here dynamically -->
    </div>
</div>

<script>
(function() {
    // ==================== CONFIG ====================
    // Update this URL to your actual booking page
    const BOOKING_URL = 'https://5dwhdnnocmn.typeform.com/to/TEzPcxMI';

    // ==================== AIRTABLE CONFIG ====================
    // Replace these with your actual Airtable credentials
    const AIRTABLE_TOKEN = 'YOUR_AIRTABLE_PAT_HERE';       // e.g. patXXXXXXXXXXXXXX
    const AIRTABLE_BASE_ID = 'YOUR_BASE_ID_HERE';          // e.g. appXXXXXXXXXXXXXX
    const AIRTABLE_TABLE_NAME = 'YOUR_TABLE_NAME_HERE';    // e.g. 'Calculator Leads'

    // Industry benchmarks (NAR + real estate coaching data)
    const BENCHMARKS = {
        // Sphere: conversion rate by touch frequency
        sphereNurturedRate: 0.04,       // monthly+ contact
        sphereQuarterlyRate: 0.025,     // every few months
        sphereYearlyRate: 0.015,        // once or twice a year
        sphereNeglectedRate: 0.007,     // rarely or never

        // Past clients: repeat/referral rate by touch frequency
        pastClientNurturedRate: 0.12,   // monthly+ contact
        pastClientQuarterlyRate: 0.08,  // every few months
        pastClientYearlyRate: 0.05,     // once or twice a year
        pastClientNeglectedRate: 0.035, // rarely or never
        // Sources: NAR 2024 Profile of Home Buyers and Sellers
    };

    // ==================== FREQUENCY HELPERS ====================
    function shouldShowStruggle() {
        const sf = state.data.sphereFrequency;
        const pcf = state.data.pastClientFrequency;
        return sf === 'yearly' || sf === 'rarely' ||
               pcf === 'yearly' || pcf === 'rarely';
    }

    function getConversionRates() {
        const sphereRates = {
            monthly:   BENCHMARKS.sphereNurturedRate,
            quarterly: BENCHMARKS.sphereQuarterlyRate,
            yearly:    BENCHMARKS.sphereYearlyRate,
            rarely:    BENCHMARKS.sphereNeglectedRate,
        };
        const pcRates = {
            monthly:   BENCHMARKS.pastClientNurturedRate,
            quarterly: BENCHMARKS.pastClientQuarterlyRate,
            yearly:    BENCHMARKS.pastClientYearlyRate,
            rarely:    BENCHMARKS.pastClientNeglectedRate,
        };
        return {
            sphereRate:     sphereRates[state.data.sphereFrequency] || BENCHMARKS.sphereNeglectedRate,
            pastClientRate: pcRates[state.data.pastClientFrequency] || BENCHMARKS.pastClientNeglectedRate,
        };
    }

    function getNetworkHealthScore(sphereFreq, pcFreq, actualDeals, potentialDeals) {
        // Score outreach frequency (0-3 each)
        const freqScores = { monthly: 3, quarterly: 2, yearly: 1, rarely: 0 };
        const sphereScore = freqScores[sphereFreq] ?? 0;
        const pcScore = freqScores[pcFreq] ?? 0;

        // Conversion efficiency: how close actual deals are to potential (0-4)
        const efficiency = potentialDeals > 0 ? Math.min(actualDeals / potentialDeals, 1) : 0;
        const efficiencyScore = Math.round(efficiency * 4);

        // Total: 0-10
        const total = sphereScore + pcScore + efficiencyScore;

        if (total >= 9) return { grade: 'A+', cls: 'grade-a', msg: 'You\'re maximizing your network. Keep it up!' };
        if (total >= 7) return { grade: 'A',  cls: 'grade-a', msg: 'Strong network habits — small tweaks can unlock the rest.' };
        if (total >= 5) return { grade: 'B',  cls: 'grade-b', msg: 'Good foundation, but inconsistent outreach is costing you deals.' };
        if (total >= 3) return { grade: 'C',  cls: 'grade-c', msg: 'Your network has potential, but it\'s under-nurtured.' };
        return                  { grade: 'D',  cls: 'grade-d', msg: 'Your network is going cold — there\'s major upside waiting.' };
    }

        return shouldShowStruggle() ? 8 : 7;

        return 'Step ' + n + ' of ' + getVisibleInputStepCount();

    function getProgressPercent() {
        if (state.currentStep === 0) return 0;
        if (state.currentStep >= 9) return 100;
        // With struggle: 9 input steps (0-8), without: 8 (0-7, skip 8)
        const total = shouldShowStruggle() ? 9 : 8;
        return (state.currentStep / total) * 100;
    }

        return labels[freq] || 'unknown';

    function wireHeroEvents(hero, step) {
        // Scroll CTA
        const scrollBtn = hero.querySelector('#heroScrollCta');
        if (scrollBtn) {
            scrollBtn.addEventListener('click', () => {
                document.getElementById('heroFormSection').scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
                setTimeout(() => {
                    const nameInput = document.getElementById('firstName');
                    if (nameInput) nameInput.focus();
                }, 600);
            });
        }

        // Form submit
        const btnNext = hero.querySelector('#btnNext');
        if (btnNext) {
            btnNext.addEventListener('click', () => {
                const result = step.validate();
                if (result !== true) {
                    showError(result);
                    return;
                }
                clearError();
                state.currentStep++;
                window.scrollTo({ top: 0, behavior: 'instant' });
                renderStep();
            });
        }

        // Enter key on inputs
        hero.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && btnNext) btnNext.click();
            });
        });
    }

    // ==================== RENDER ====================
    function renderStep() {
        const calculator = document.getElementById('calculator');
        const container = document.getElementById('stepContainer');
        const progress = document.getElementById('progressFill');
        const step = steps[state.currentStep];

        // === HERO MODE for Step 0 ===
        if (state.currentStep === 0) {
            document.body.classList.add('hero-active');

            let hero = document.getElementById('heroLanding');
            if (!hero) {
                hero = document.createElement('div');
                hero.id = 'heroLanding';
                hero.className = 'hero-landing';
                document.body.insertBefore(hero, calculator);
            }
            hero.innerHTML = renderHeroPage();
            wireHeroEvents(hero, step);
            return;
        }

        // === NORMAL CARD MODE for Steps 1+ ===
        document.body.classList.remove('hero-active');
        const hero = document.getElementById('heroLanding');
        if (hero) hero.remove();

        container.innerHTML = step.render();
        progress.style.width = `${getProgressPercent()}%`;

        // Wire up buttons
        const btnNext = document.getElementById('btnNext');
        const btnBack = document.getElementById('btnBack');

        if (btnNext) {
            btnNext.addEventListener('click', () => {
                const result = step.validate();
                if (result !== true) {
                    showError(result);
                    return;
                }
                clearError();
                state.currentStep++;
                // Skip struggle step (8) if not needed
                if (state.currentStep === 8 && !shouldShowStruggle()) {
                    state.data.struggleReason = null;
                    state.currentStep++;
                }
                renderStep();
            });
        }

        if (btnBack) {
            btnBack.addEventListener('click', () => {
                state.currentStep--;
                // Skip struggle step (8) when going back if not needed
                if (state.currentStep === 8 && !shouldShowStruggle()) {
                    state.currentStep--;
                }
                renderStep();
            });
        }

        // Enter key to advance
        container.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && btnNext && !btnNext.disabled) btnNext.click();
            });
        });

        // Focus first input
        const firstInput = container.querySelector('input:not([type="hidden"])');
        if (firstInput) setTimeout(() => firstInput.focus(), 50);

        // Post-render hooks
        if (step.afterRender) step.afterRender();
    }

    function showError(msg) {
        clearError();
        const el = document.createElement('div');
        el.className = 'input-error';
        el.style.cssText = 'color:#dc2626;font-size:13px;margin-top:-12px;margin-bottom:12px;';
        el.textContent = msg;
        const btnRow = document.querySelector('.btn-row');
        if (btnRow) btnRow.parentNode.insertBefore(el, btnRow);
    }

    function clearError() {
        const existing = document.querySelector('.input-error');
        if (existing) existing.remove();
    }

    // ==================== RESULTS CALCULATION ====================
    function renderResults() {
        const d = state.data;
        const sphere = Number(d.sphereSize);
        const pastClients = Number(d.pastClients);
        const actualDeals = Number(d.transactionsLastYear);
        const homePrice = Number(d.avgHomePrice);
        const commission = Number(d.commissionPct) / 100;

        const gciPerDeal = homePrice * commission;

        // ACTUAL income based on their real numbers
        const currentIncome = actualDeals * gciPerDeal;

        // Current frequency deals (what their network generates now)
        const rates = getConversionRates();
        const currentSphereDeals = sphere * rates.sphereRate;
        const currentPCDeals = pastClients * rates.pastClientRate;
        const currentNetworkDeals = currentSphereDeals + currentPCDeals;
        const currentNetworkIncome = currentNetworkDeals * gciPerDeal;

        // Potential at MONTHLY outreach (the full upside)
        const potentialSphereDeals = sphere * BENCHMARKS.sphereNurturedRate;
        const potentialPCDeals = pastClients * BENCHMARKS.pastClientNurturedRate;
        const potentialTotalDeals = potentialSphereDeals + potentialPCDeals;
        const potentialIncome = potentialTotalDeals * gciPerDeal;

        // Gap = monthly potential minus what they actually made
        const gap = potentialIncome - currentIncome;
        const gapDeals = potentialTotalDeals - actualDeals;

        return `
            <div class="step results-section" style="display:block;">
                <div class="results-header">

                    <div class="result-value">${formatMoney(currentIncome)}<span style="font-size:16px;font-weight:400;color:#777">/yr</span></div>
                    <div class="result-detail">${actualDeals} transactions at ${formatMoney(gciPerDeal)} per deal</div>
                </div>

                <div class="result-card potential">
                    <div class="result-label">What your network could generate</div>
                    <div class="result-value">${formatMoney(potentialIncome)}<span style="font-size:16px;font-weight:400;color:#777">/yr</span></div>
                    <div class="result-detail">~${potentialTotalDeals.toFixed(1)} transactions/year with consistent monthly outreach</div>
                </div>

                ${gap > 0 ? `
                <div class="result-card gap">
                    <div class="result-label">You're leaving on the table</div>
                    <div class="result-value">${formatMoney(gap)}<span style="font-size:16px;font-weight:400;color:#777">/yr</span></div>
                    <div class="result-detail">That's ~${gapDeals.toFixed(1)} extra deals per year sitting in your phone right now</div>
                </div>
                ` : ''}

                <div class="bar-chart">
                    <div class="bar-chart-title">Your income at a glance</div>
                    <div class="bar-row">
                        <div class="bar-label">
                            <span class="bar-label-text">Current GCI</span>
                            <span class="bar-label-value" style="color:var(--warning)">${formatMoney(currentIncome)}</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill current" style="width:${potentialIncome > 0 ? Math.round((currentIncome / potentialIncome) * 100) : 0}%"></div>
                        </div>
                    </div>
                    <div class="bar-row">
                        <div class="bar-label">
                            <span class="bar-label-text">Potential GCI (monthly outreach)</span>
                            <span class="bar-label-value" style="color:var(--success)">${formatMoney(potentialIncome)}</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill potential" style="width:100%"></div>
                        </div>
                    </div>
                    ${gap > 0 ? `
                    <div class="bar-gap-marker">
                        +${formatMoney(gap)} opportunity gap
                    </div>
                    ` : ''}
                </div>

                ${gap > 0 ? `
                <div class="monthly-breakdown">
                    <div class="monthly-card">
                        <div class="monthly-label">Per month</div>
                        <div class="monthly-value">+${formatMoney(Math.round(gap / 12))}</div>
                        <div class="monthly-context">extra income</div>
                    </div>
                    <div class="monthly-card">
                        <div class="monthly-label">Per week</div>
                        <div class="monthly-value">+${formatMoney(Math.round(gap / 52))}</div>
                        <div class="monthly-context">extra income</div>
                    </div>
                    <div class="monthly-card">
                        <div class="monthly-label">Per deal</div>
                        <div class="monthly-value">${formatMoney(gciPerDeal)}</div>
                        <div class="monthly-context">${gapDeals.toFixed(1)} extra deals</div>
                    </div>
                </div>
                ` : ''}

                ${(() => {
                    const health = getNetworkHealthScore(d.sphereFrequency, d.pastClientFrequency, actualDeals, potentialTotalDeals);
                    const freqLabel = { monthly: 'good', quarterly: 'ok', yearly: 'poor', rarely: 'poor' };
                    return `
                    <div class="health-score-card">
                        <div class="health-title">Network Health Score</div>
                        <div class="health-grade ${health.cls}">${health.grade}</div>
                        <div class="health-summary">${health.msg}</div>
                        <div class="health-factors">
                            <div class="health-factor">
                                <span class="factor-dot ${freqLabel[d.sphereFrequency] || 'poor'}"></span>
                                Sphere outreach
                            </div>
                            <div class="health-factor">
                                <span class="factor-dot ${freqLabel[d.pastClientFrequency] || 'poor'}"></span>
                                Past client outreach
                            </div>
                            <div class="health-factor">
                                <span class="factor-dot ${potentialTotalDeals > 0 && (actualDeals / potentialTotalDeals) >= 0.6 ? 'good' : (actualDeals / potentialTotalDeals) >= 0.3 ? 'ok' : 'poor'}"></span>
                                Conversion efficiency
                            </div>
                        </div>
                    </div>`;
                })()}

                ${(() => {
                    // Calculate uplift from improving each channel
                    const sphereUplift = (BENCHMARKS.sphereNurturedRate - (rates.sphereRate)) * sphere * gciPerDeal;
                    const pcUplift = (BENCHMARKS.pastClientNurturedRate - (rates.pastClientRate)) * pastClients * gciPerDeal;

                    const opportunities = [];
                    if (d.sphereFrequency !== 'monthly' && sphereUplift > 0) {
                        opportunities.push({
                            label: 'Nurture your sphere monthly',
                            detail: `Your ${sphere.toLocaleString()} sphere contacts are converting at ${(rates.sphereRate * 100).toFixed(1)}%. Monthly outreach could push that to ${(BENCHMARKS.sphereNurturedRate * 100).toFixed(1)}%.`,
                            value: sphereUplift,
                        });
                    }
                    if (d.pastClientFrequency !== 'monthly' && pcUplift > 0) {
                        opportunities.push({
                            label: 'Stay in touch with past clients monthly',
                            detail: `Your ${pastClients.toLocaleString()} past clients are converting at ${(rates.pastClientRate * 100).toFixed(1)}%. With monthly check-ins, that could reach ${(BENCHMARKS.pastClientNurturedRate * 100).toFixed(1)}%.`,
                            value: pcUplift,
                        });
                    }

                    // Sort by value desc and take the biggest
                    opportunities.sort((a, b) => b.value - a.value);
                    const top = opportunities[0];

                    if (!top) return '';
                    return `
                    <div class="opportunity-callout">
                        <div class="opp-eyebrow">Your #1 opportunity</div>
                        <div class="opp-headline">${top.label}</div>
                        <div class="opp-detail">${top.detail}</div>
                        <div class="opp-value">+${formatMoney(Math.round(top.value))}/yr</div>
                    </div>`;
                })()}

                <div class="breakdown">
                    <div class="breakdown-title">How we calculated this</div>
                    <div class="breakdown-row">
                        <span class="label">Your transactions last year</span>
                        <span class="value">${actualDeals} deals</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Avg home price</span>
                        <span class="value">${formatMoney(homePrice)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Commission per deal</span>
                        <span class="value">${formatMoney(gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Your GCI last year</span>
                        <span class="value">${formatMoney(currentIncome)}</span>
                    </div>
                    <div class="breakdown-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px;">
                        <span class="label">Sphere of influence</span>
                        <span class="value">${sphere.toLocaleString()} people</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Past clients</span>
                        <span class="value">${pastClients.toLocaleString()} people</span>
                    </div>
                    <div class="breakdown-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px;">
                        <span class="label" style="font-weight:700;">Where you are now (${getFrequencyLabel(d.sphereFrequency)} outreach)</span>
                        <span class="value"></span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Sphere (${(rates.sphereRate * 100).toFixed(1)}% conversion)</span>
                        <span class="value">${currentSphereDeals.toFixed(1)} deals &rarr; ${formatMoney(currentSphereDeals * gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Past clients (${(rates.pastClientRate * 100).toFixed(1)}% conversion)</span>
                        <span class="value">${currentPCDeals.toFixed(1)} deals &rarr; ${formatMoney(currentPCDeals * gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row highlight" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px;">
                        <span class="label" style="font-weight:700;">With monthly outreach</span>
                        <span class="value"></span>
                    </div>
                    <div class="breakdown-row highlight">
                        <span class="label">Sphere (${(BENCHMARKS.sphereNurturedRate * 100).toFixed(1)}% conversion)</span>
                        <span class="value">${potentialSphereDeals.toFixed(1)} deals &rarr; ${formatMoney(potentialSphereDeals * gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row highlight">
                        <span class="label">Past clients (${(BENCHMARKS.pastClientNurturedRate * 100).toFixed(1)}% conversion)</span>
                        <span class="value">${potentialPCDeals.toFixed(1)} deals &rarr; ${formatMoney(potentialPCDeals * gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px;">
                        <span class="label"><strong>Total network potential</strong></span>
                        <span class="value" style="color:var(--success);font-weight:800;">${potentialTotalDeals.toFixed(1)} deals &rarr; ${formatMoney(potentialIncome)}</span>
                    </div>
                </div>

                <div class="data-source">
                    Conversion rates based on NAR Profile of Home Buyers &amp; Sellers, Buffini &amp; Company research,
                    and real estate coaching industry benchmarks. Individual results vary based on market conditions and effort.
                </div>

                <div class="cta-section">
                    <p>
                        <strong>${gap > 0 ? formatMoney(gap) + ' is a lot to leave on the table.' : 'Great job — you\'re capturing your network\'s potential.'}</strong><br>
                        ${gap > 0
                            ? "Let's build a plan to capture it — no fluff, just a system that works."
                            : "Let's talk about how to maintain and grow these numbers even further."
                        }
                    </p>
                    <a href="${BOOKING_URL}" class="btn-cta" id="btnBookCall">Book a Free Strategy Call</a>
                    <br>
                    <button class="btn-restart" id="btnRestart">Start over</button>
                </div>
            </div>
        `;
    }

    // ==================== AIRTABLE SUBMISSION ====================
    function sendToAirtable() {
        const d = state.data;
        const sphere = Number(d.sphereSize);
        const pastClients = Number(d.pastClients);
        const actualDeals = Number(d.transactionsLastYear);
        const homePrice = Number(d.avgHomePrice);
        const commission = Number(d.commissionPct) / 100;
        const gciPerDeal = homePrice * commission;
        const currentIncome = actualDeals * gciPerDeal;
        const potentialSphereDeals = sphere * BENCHMARKS.sphereNurturedRate;
        const potentialPCDeals = pastClients * BENCHMARKS.pastClientNurturedRate;
        const potentialTotalDeals = potentialSphereDeals + potentialPCDeals;
        const potentialIncome = potentialTotalDeals * gciPerDeal;
        const gap = potentialIncome - currentIncome;

        const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`;

        fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + AIRTABLE_TOKEN,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                fields: {
                    'First Name': d.firstName,
                    'Email': d.email,
                    'Sphere Size': sphere,
                    'Past Clients': pastClients,
                    'Transactions Last Year': actualDeals,
                    'Avg Home Price': homePrice,
                    'Commission %': Number(d.commissionPct),
                    'Sphere Touch Frequency': d.sphereFrequency || '',
                    'Past Client Touch Frequency': d.pastClientFrequency || '',
                    'Struggle Reason': d.struggleReason || '',
                    'GCI Per Deal': Math.round(gciPerDeal),
                    'Current GCI': Math.round(currentIncome),
                    'Potential GCI': Math.round(potentialIncome),
                    'Gap Amount': Math.round(gap),
                    'Potential Deals': Math.round(potentialTotalDeals * 10) / 10,
                    'Submitted At': new Date().toISOString()
                }
            })
        }).catch(function() {
            // Silently fail — don't block the user from booking
        });
    }

    // ==================== HELPERS ====================
    function formatMoney(n) {
        return '$' + Math.round(n).toLocaleString('en-US');
    }

    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ==================== INIT ====================
    renderStep();

    // Send to Airtable when CTA is clicked, then let the link navigate
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'btnBookCall') {
            sendToAirtable();
        }
    });

    // Delegate restart button (rendered inside results)
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'btnRestart') {
            state.currentStep = 0;
            state.data = {
                firstName: '',
                email: '',
                sphereSize: '',
                pastClients: '',
                avgHomePrice: '',
                commissionPct: '',
                transactionsLastYear: '',
                sphereFrequency: null,
                pastClientFrequency: null,
                struggleReason: null
            };
            window.scrollTo({ top: 0, behavior: 'instant' });
            renderStep();
        }
    });
})();
</script>

</body>
</html>
