<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtor Referral Earnings Calculator</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #f5c518;
            --accent-hover: #d4a90e;
            --success: #16a34a;
            --warning: #dc2626;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #555555;
            --border: #e0e0e0;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Progress bar */
        .progress-bar {
            height: 4px;
            background: var(--border);
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.4s ease;
            border-radius: 0 2px 2px 0;
        }

        .step-content {
            padding: 40px 36px 36px;
        }

        .step-counter {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .step-question {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .step-context {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .step-context a {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Form inputs */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg);
            color: var(--text);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: #999;
        }

        .input-prefix {
            position: relative;
        }
        .input-prefix span {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .input-prefix input {
            padding-left: 30px;
        }

        .input-suffix {
            position: relative;
        }
        .input-suffix span {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .input-suffix input {
            padding-right: 30px;
        }

        /* Option cards for yes/no */
        .option-cards {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-card {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text);
        }
        .option-card:hover {
            border-color: var(--accent);
            background: #fef9e7;
        }
        .option-card.selected {
            border-color: var(--accent);
            background: #fef3cd;
            color: #1a1a1a;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1a1a;
            flex: 1;
            font-weight: 700;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled {
            background: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        .btn-back {
            background: #fff;
            color: var(--text-muted);
            border: 2px solid var(--border);
        }
        .btn-back:hover { background: #f0f0f0; }

        /* Results page */
        .results-section { display: none; }

        .results-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .results-header h2 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .results-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .result-card {
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .result-card.current {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }
        .result-card.potential {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }
        .result-card.gap {
            background: #fef9e7;
            border: 1px solid #f5c518;
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .result-card.current .result-label { color: #991b1b; }
        .result-card.potential .result-label { color: #166534; }
        .result-card.gap .result-label { color: #92400e; }

        .result-value {
            font-size: 32px;
            font-weight: 800;
        }
        .result-card.current .result-value { color: var(--warning); }
        .result-card.potential .result-value { color: var(--success); }
        .result-card.gap .result-value { color: #b45309; }

        .result-detail {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Breakdown table */
        .breakdown {
            margin: 24px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .breakdown-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            padding: 14px 20px 10px;
            background: var(--bg);
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
        .breakdown-row .label { color: var(--text-muted); }
        .breakdown-row .value { font-weight: 600; color: var(--text); }
        .breakdown-row.highlight {
            background: #f0fdf4;
        }
        .breakdown-row.highlight .value { color: var(--success); font-weight: 700; }

        /* Source footnote */
        .data-source {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* CTA section */
        .cta-section {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .cta-section p {
            font-size: 15px;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .cta-section .btn-cta {
            display: inline-block;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 700;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .cta-section .btn-cta:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245,197,24,0.4);
        }
        .btn-restart {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            text-decoration: underline;
        }

        /* Hidden utility */
        .hidden { display: none !important; }

        /* Animate step transitions */
        .step { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .step-content { padding: 28px 22px 26px; }
            .step-question { font-size: 19px; }
            .result-value { font-size: 26px; }
            .option-cards { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="calculator" id="calculator">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="step-content" id="stepContainer">
        <!-- Steps render here dynamically -->
    </div>
</div>

<script>
(function() {
    // ==================== CONFIG ====================
    // Update this URL to your actual booking page
    const BOOKING_URL = 'https://5dwhdnnocmn.typeform.com/to/TEzPcxMI';

    // ==================== AIRTABLE CONFIG ====================
    // Replace these with your actual Airtable credentials
    const AIRTABLE_TOKEN = 'YOUR_AIRTABLE_PAT_HERE';       // e.g. patXXXXXXXXXXXXXX
    const AIRTABLE_BASE_ID = 'YOUR_BASE_ID_HERE';          // e.g. appXXXXXXXXXXXXXX
    const AIRTABLE_TABLE_NAME = 'YOUR_TABLE_NAME_HERE';    // e.g. 'Calculator Leads'

    // Industry benchmarks (NAR + real estate coaching data)
    const BENCHMARKS = {
        // A well-nurtured sphere converts at ~2 transactions per 50 contacts/year
        sphereNurturedRate: 0.04,
        // Without nurturing, sphere converts at roughly 0.5-1%
        sphereNeglectedRate: 0.007,
        // Past clients with consistent follow-up: ~12% repeat/referral rate per year
        pastClientNurturedRate: 0.12,
        // Past clients without follow-up: ~3-4% per year
        pastClientNeglectedRate: 0.035,
        // Referral sources: NAR 2024 Profile of Home Buyers and Sellers
    };

    // ==================== STATE ====================
    const state = {
        currentStep: 0,
        data: {
            firstName: '',
            email: '',
            sphereSize: '',
            pastClients: '',
            avgHomePrice: '',
            commissionPct: '',
            transactionsLastYear: '',
            hasFollowUp: null
        }
    };

    // ==================== STEP DEFINITIONS ====================
    const steps = [
        {
            id: 'intro',
            render: () => `
                <div class="step">
                    <div class="step-question">See what your network is really worth.</div>
                    <p class="step-context">
                        This takes about 60 seconds. We'll use real industry data to show you
                        how much revenue your sphere and past clients could be generating —
                        and what you might be leaving on the table.
                    </p>
                    <div class="input-group">
                        <label>First name</label>
                        <input type="text" id="firstName" placeholder="Your first name" value="${esc(state.data.firstName)}" autofocus>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="you@email.com" value="${esc(state.data.email)}">
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" id="btnNext">Let's see the numbers</button>
                    </div>
                </div>
            `,
            validate: () => {
                const name = document.getElementById('firstName').value.trim();
                const email = document.getElementById('email').value.trim();
                if (!name) return 'Please enter your first name.';
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Please enter a valid email.';
                state.data.firstName = name;
                state.data.email = email;
                return true;
            }
        },
        {
            id: 'sphere',
            render: () => `
                <div class="step">
                    <div class="step-counter">Step 1 of 6</div>
                    <div class="step-question">How many people are in your sphere of influence?</div>
                    <p class="step-context">
                        Think broadly: friends, family, neighbors, gym buddies, parents from your kids' school,
                        your dentist, your barber — anyone who knows you're in real estate.
                        Most agents undercount. The average is 200-300.
                    </p>
                    <div class="input-group">
                        <input type="number" id="sphereSize" placeholder="e.g. 250" min="0" value="${esc(state.data.sphereSize)}" autofocus>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-back" id="btnBack">Back</button>
                        <button class="btn btn-primary" id="btnNext">Next</button>
                    </div>
                </div>
            `,
            validate: () => {
                const v = document.getElementById('sphereSize').value.trim();
                if (!v || isNaN(v) || Number(v) < 0) return 'Enter a number (even a rough estimate works).';
                state.data.sphereSize = v;
                return true;
            }
        },
        {
            id: 'pastClients',
            render: () => `
                <div class="step">
                    <div class="step-counter">Step 2 of 6</div>
                    <div class="step-question">How many past clients do you have?</div>
                    <p class="step-context">
                        Total number of people you've helped buy or sell — over your entire career.
                        Include both buyers and sellers.
                    </p>
                    <div class="input-group">
                        <input type="number" id="pastClients" placeholder="e.g. 75" min="0" value="${esc(state.data.pastClients)}" autofocus>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-back" id="btnBack">Back</button>
                        <button class="btn btn-primary" id="btnNext">Next</button>
                    </div>
                </div>
            `,
            validate: () => {
                const v = document.getElementById('pastClients').value.trim();
                if (!v || isNaN(v) || Number(v) < 0) return 'Enter your past client count.';
                state.data.pastClients = v;
                return true;
            }
        },
        {
            id: 'transactions',
            render: () => `
                <div class="step">
                    <div class="step-counter">Step 3 of 6</div>
                    <div class="step-question">How many transactions did you close last year?</div>
                    <p class="step-context">
                        Count each side — if you helped someone buy and someone else sell, that's 2.
                        Be honest. This is just to show you the real gap.
                    </p>
                    <div class="input-group">
                        <input type="number" id="transactionsLastYear" placeholder="e.g. 8" min="0" value="${esc(state.data.transactionsLastYear)}" autofocus>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-back" id="btnBack">Back</button>
                        <button class="btn btn-primary" id="btnNext">Next</button>
                    </div>
                </div>
            `,
            validate: () => {
                const v = document.getElementById('transactionsLastYear').value.trim();
                if (!v || isNaN(v) || Number(v) < 0) return 'Enter how many deals you closed last year.';
                state.data.transactionsLastYear = v;
                return true;
            }
        },
        {
            id: 'market',
            render: () => `
                <div class="step">
                    <div class="step-counter">Step 4 of 6</div>
                    <div class="step-question">What's the average home price in your market?</div>
                    <p class="step-context">
                        A rough average is fine. Think about the typical sale price of homes you work with.
                    </p>
                    <div class="input-group">
                        <div class="input-prefix">
                            <span>$</span>
                            <input type="number" id="avgHomePrice" placeholder="e.g. 400000" min="0" step="10000" value="${esc(state.data.avgHomePrice)}" autofocus>
                        </div>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-back" id="btnBack">Back</button>
                        <button class="btn btn-primary" id="btnNext">Next</button>
                    </div>
                </div>
            `,
            validate: () => {
                const v = document.getElementById('avgHomePrice').value.trim();
                if (!v || isNaN(v) || Number(v) <= 0) return 'Enter an average home price.';
                state.data.avgHomePrice = v;
                return true;
            }
        },
        {
            id: 'commission',
            render: () => `
                <div class="step">
                    <div class="step-counter">Step 5 of 6</div>
                    <div class="step-question">What's your average commission per side?</div>
                    <p class="step-context">
                        Your gross commission percentage per transaction (before splits/fees).
                    </p>
                    <div class="input-group">
                        <div class="input-suffix">
                            <span>%</span>
                            <input type="number" id="commissionPct" placeholder="e.g. 2.5" min="0" max="10" step="0.1" value="${esc(state.data.commissionPct)}" autofocus>
                        </div>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-back" id="btnBack">Back</button>
                        <button class="btn btn-primary" id="btnNext">Next</button>
                    </div>
                </div>
            `,
            validate: () => {
                const v = document.getElementById('commissionPct').value.trim();
                if (!v || isNaN(v) || Number(v) <= 0 || Number(v) > 10) return 'Enter a valid commission % (e.g. 2.5).';
                state.data.commissionPct = v;
                return true;
            }
        },
        {
            id: 'followup',
            render: () => `
                <div class="step">
                    <div class="step-counter">Step 6 of 6</div>
                    <div class="step-question">Do you have a consistent follow-up system for your sphere and past clients?</div>
                    <p class="step-context">
                        Be honest — this means regular touchpoints (monthly+), not just holiday cards.
                        Think: calls, texts, events, mailers, pop-bys on a consistent schedule.
                    </p>
                    <div class="option-cards" id="followUpOptions">
                        <div class="option-card ${state.data.hasFollowUp === true ? 'selected' : ''}" data-value="yes">
                            Yes, consistently
                        </div>
                        <div class="option-card ${state.data.hasFollowUp === false ? 'selected' : ''}" data-value="no">
                            Not really
                        </div>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-back" id="btnBack">Back</button>
                        <button class="btn btn-primary" id="btnNext" ${state.data.hasFollowUp === null ? 'disabled' : ''}>See my results</button>
                    </div>
                </div>
            `,
            validate: () => {
                if (state.data.hasFollowUp === null) return 'Select one of the options.';
                return true;
            },
            afterRender: () => {
                document.querySelectorAll('.option-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        state.data.hasFollowUp = card.dataset.value === 'yes';
                        document.getElementById('btnNext').disabled = false;
                    });
                });
            }
        },
        {
            id: 'results',
            render: () => renderResults(),
            validate: () => true
        }
    ];

    const TOTAL_INPUT_STEPS = 7; // intro + 6 questions (results not counted)

    // ==================== RENDER ====================
    function renderStep() {
        const container = document.getElementById('stepContainer');
        const progress = document.getElementById('progressFill');
        const step = steps[state.currentStep];

        container.innerHTML = step.render();
        progress.style.width = `${(state.currentStep / TOTAL_INPUT_STEPS) * 100}%`;

        // Wire up buttons
        const btnNext = document.getElementById('btnNext');
        const btnBack = document.getElementById('btnBack');

        if (btnNext) {
            btnNext.addEventListener('click', () => {
                const result = step.validate();
                if (result !== true) {
                    showError(result);
                    return;
                }
                clearError();
                state.currentStep++;
                renderStep();
            });
        }

        if (btnBack) {
            btnBack.addEventListener('click', () => {
                state.currentStep--;
                renderStep();
            });
        }

        // Enter key to advance
        container.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && btnNext && !btnNext.disabled) btnNext.click();
            });
        });

        // Focus first input
        const firstInput = container.querySelector('input:not([type="hidden"])');
        if (firstInput) setTimeout(() => firstInput.focus(), 50);

        // Post-render hooks
        if (step.afterRender) step.afterRender();
    }

    function showError(msg) {
        clearError();
        const el = document.createElement('div');
        el.className = 'input-error';
        el.style.cssText = 'color:#dc2626;font-size:13px;margin-top:-12px;margin-bottom:12px;';
        el.textContent = msg;
        const btnRow = document.querySelector('.btn-row');
        if (btnRow) btnRow.parentNode.insertBefore(el, btnRow);
    }

    function clearError() {
        const existing = document.querySelector('.input-error');
        if (existing) existing.remove();
    }

    // ==================== RESULTS CALCULATION ====================
    function renderResults() {
        const d = state.data;
        const sphere = Number(d.sphereSize);
        const pastClients = Number(d.pastClients);
        const actualDeals = Number(d.transactionsLastYear);
        const homePrice = Number(d.avgHomePrice);
        const commission = Number(d.commissionPct) / 100;

        const gciPerDeal = homePrice * commission;

        // ACTUAL income based on their real numbers
        const currentIncome = actualDeals * gciPerDeal;

        // Potential with proper nurturing of sphere + past clients
        const potentialSphereDeals = sphere * BENCHMARKS.sphereNurturedRate;
        const potentialPCDeals = pastClients * BENCHMARKS.pastClientNurturedRate;
        const potentialTotalDeals = potentialSphereDeals + potentialPCDeals;
        const potentialIncome = potentialTotalDeals * gciPerDeal;

        // Gap = what they could be making minus what they actually made
        const gap = potentialIncome - currentIncome;
        const gapDeals = potentialTotalDeals - actualDeals;

        return `
            <div class="step results-section" style="display:block;">
                <div class="results-header">
                    <h2>${esc(d.firstName)}, here's what your network is worth.</h2>
                    <p>Based on your numbers and NAR industry data</p>
                </div>

                <div class="result-card current">
                    <div class="result-label">Your GCI last year</div>
                    <div class="result-value">${formatMoney(currentIncome)}<span style="font-size:16px;font-weight:400;color:#777">/yr</span></div>
                    <div class="result-detail">${actualDeals} transactions at ${formatMoney(gciPerDeal)} per deal</div>
                </div>

                <div class="result-card potential">
                    <div class="result-label">What your network could generate</div>
                    <div class="result-value">${formatMoney(potentialIncome)}<span style="font-size:16px;font-weight:400;color:#777">/yr</span></div>
                    <div class="result-detail">~${potentialTotalDeals.toFixed(1)} transactions/year when your sphere and past clients are properly nurtured</div>
                </div>

                ${gap > 0 ? `
                <div class="result-card gap">
                    <div class="result-label">You're leaving on the table</div>
                    <div class="result-value">${formatMoney(gap)}<span style="font-size:16px;font-weight:400;color:#777">/yr</span></div>
                    <div class="result-detail">That's ~${gapDeals.toFixed(1)} extra deals per year sitting in your phone right now</div>
                </div>
                ` : ''}

                <div class="breakdown">
                    <div class="breakdown-title">How we calculated this</div>
                    <div class="breakdown-row">
                        <span class="label">Your transactions last year</span>
                        <span class="value">${actualDeals} deals</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Avg home price</span>
                        <span class="value">${formatMoney(homePrice)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Commission per deal</span>
                        <span class="value">${formatMoney(gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Your GCI last year</span>
                        <span class="value">${formatMoney(currentIncome)}</span>
                    </div>
                    <div class="breakdown-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px;">
                        <span class="label">Sphere of influence</span>
                        <span class="value">${sphere.toLocaleString()} people</span>
                    </div>
                    <div class="breakdown-row">
                        <span class="label">Past clients</span>
                        <span class="value">${pastClients.toLocaleString()} people</span>
                    </div>
                    <div class="breakdown-row highlight">
                        <span class="label">Sphere potential (nurtured at 4%)</span>
                        <span class="value">${potentialSphereDeals.toFixed(1)} deals &rarr; ${formatMoney(potentialSphereDeals * gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row highlight">
                        <span class="label">Past client potential (nurtured at 12%)</span>
                        <span class="value">${potentialPCDeals.toFixed(1)} deals &rarr; ${formatMoney(potentialPCDeals * gciPerDeal)}</span>
                    </div>
                    <div class="breakdown-row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:14px;">
                        <span class="label"><strong>Total network potential</strong></span>
                        <span class="value" style="color:var(--success);font-weight:800;">${potentialTotalDeals.toFixed(1)} deals &rarr; ${formatMoney(potentialIncome)}</span>
                    </div>
                </div>

                <div class="data-source">
                    Conversion rates based on NAR Profile of Home Buyers &amp; Sellers, Buffini &amp; Company research,
                    and real estate coaching industry benchmarks. Individual results vary based on market conditions and effort.
                </div>

                <div class="cta-section">
                    <p>
                        <strong>${gap > 0 ? formatMoney(gap) + ' is a lot to leave on the table.' : 'Great job — you\'re capturing your network\'s potential.'}</strong><br>
                        ${gap > 0
                            ? "Let's build a plan to capture it — no fluff, just a system that works."
                            : "Let's talk about how to maintain and grow these numbers even further."
                        }
                    </p>
                    <a href="${BOOKING_URL}" class="btn-cta" id="btnBookCall">Book a Free Strategy Call</a>
                    <br>
                    <button class="btn-restart" id="btnRestart">Start over</button>
                </div>
            </div>
        `;
    }

    // ==================== AIRTABLE SUBMISSION ====================
    function sendToAirtable() {
        const d = state.data;
        const sphere = Number(d.sphereSize);
        const pastClients = Number(d.pastClients);
        const actualDeals = Number(d.transactionsLastYear);
        const homePrice = Number(d.avgHomePrice);
        const commission = Number(d.commissionPct) / 100;
        const gciPerDeal = homePrice * commission;
        const currentIncome = actualDeals * gciPerDeal;
        const potentialSphereDeals = sphere * BENCHMARKS.sphereNurturedRate;
        const potentialPCDeals = pastClients * BENCHMARKS.pastClientNurturedRate;
        const potentialTotalDeals = potentialSphereDeals + potentialPCDeals;
        const potentialIncome = potentialTotalDeals * gciPerDeal;
        const gap = potentialIncome - currentIncome;

        const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`;

        fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + AIRTABLE_TOKEN,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                fields: {
                    'First Name': d.firstName,
                    'Email': d.email,
                    'Sphere Size': sphere,
                    'Past Clients': pastClients,
                    'Transactions Last Year': actualDeals,
                    'Avg Home Price': homePrice,
                    'Commission %': Number(d.commissionPct),
                    'Has Follow-Up System': d.hasFollowUp ? 'Yes' : 'No',
                    'GCI Per Deal': Math.round(gciPerDeal),
                    'Current GCI': Math.round(currentIncome),
                    'Potential GCI': Math.round(potentialIncome),
                    'Gap Amount': Math.round(gap),
                    'Potential Deals': Math.round(potentialTotalDeals * 10) / 10,
                    'Submitted At': new Date().toISOString()
                }
            })
        }).catch(function() {
            // Silently fail — don't block the user from booking
        });
    }

    // ==================== HELPERS ====================
    function formatMoney(n) {
        return '$' + Math.round(n).toLocaleString('en-US');
    }

    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ==================== INIT ====================
    renderStep();

    // Send to Airtable when CTA is clicked, then let the link navigate
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'btnBookCall') {
            sendToAirtable();
        }
    });

    // Delegate restart button (rendered inside results)
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'btnRestart') {
            state.currentStep = 0;
            state.data = {
                firstName: '',
                email: '',
                sphereSize: '',
                pastClients: '',
                avgHomePrice: '',
                commissionPct: '',
                transactionsLastYear: '',
                hasFollowUp: null
            };
            renderStep();
        }
    });
})();
</script>

</body>
</html>
